agent:
  memory:
    size: 5
    type: window_buffer
  model: deepseek-chat
  name: MathHelper
  thinking: disabled
  system_prompt:
    defaults:
      user_name: Jie.
    template: 'You are a helpful math assistant. User: {{ user_name }}'
  tools:
  - function: add_numbers
    module: deepseek_framework.utils.math
    name: add
  - function: subtract_numbers
    module: deepseek_framework.utils.math
    name: subtract
  - function: list_holding
    module: deepseek_framework.utils.fetch
    name: list_holding
    description: Get the list of holding stocks
  - function: record
    module: deepseek_framework.utils.fetch
    name: record
    description: 获取持仓详细列表数据
  - function: get_history_data
    module: deepseek_framework.utils.fetch
    name: get_history_data
    description: 获取指定股票的K线数据，或每日数据
  - function: get_type
    module: deepseek_framework.utils.fetch
    name: get_type
    description: 获取股票或指数的type值，'指数'或'index'返回1，'股票'或'stock'返回2